name: Course benchmark daily pipeline

on:
  push:
    branches: [system-completion]
    paths:
      - .github/workflows/course-benchmark.yml
      - ml_financial_prediction/scripts/run_hosted_course.py
      - ml_financial_prediction/src/finpred/pipelines/course_benchmark.py
      - ml_financial_prediction/deployment/hosted/run-course.sh
  workflow_dispatch:
    inputs:
      mode:
        description: Initialize fits once for future dates; rehearsal never trains or submits
        required: true
        type: choice
        default: rehearsal
        options: [rehearsal, initialize, train, predict, submit, verify]
      target_date:
        description: Optional official YYYY-MM-DD; cannot bypass actual-time gates
        required: false
        type: string
  schedule:
    # Primary + bounded backup attempts. Same-day training and accepted CSVs are
    # idempotent; no HPO loop, date rebasing, or late catch-up submission.
    - cron: '20 23 * * *'
    - cron: '35 23 * * *'
    - cron: '10 0 * * *'
    - cron: '14 0 * * *'
    - cron: '20 0 * * *'
    - cron: '27 0 * * *'
    - cron: '35 0 * * *'
    - cron: '42 0 * * *'

permissions:
  contents: write

concurrency:
  # Keep strict-PIT and shadow pending jobs separate. All publishers still use
  # the same durable live-data lease and parent-SHA checks before any POST.
  group: finpred-course-benchmark
  cancel-in-progress: false

jobs:
  course:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: source
          persist-credentials: false
      - name: Verify data repository visibility and identity
        env:
          FINPRED_ALLOW_PUBLIC_DATA: 'true'
          FINPRED_DATA_REPOSITORY: ${{ vars.FINPRED_DATA_REPOSITORY || github.repository }}
          FINPRED_DATA_TOKEN: ${{ secrets.FINPRED_DATA_TOKEN }}
          GH_TOKEN: ${{ secrets.FINPRED_DATA_TOKEN || github.token }}
        run: bash source/ml_financial_prediction/deployment/hosted/preflight.sh
      - name: Check out durable data and isolated model state
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ vars.FINPRED_DATA_REPOSITORY || github.repository }}
          token: ${{ secrets.FINPRED_DATA_TOKEN || github.token }}
          ref: live-data
          path: live-data
          fetch-depth: 1
          persist-credentials: true
      - name: Set up locked Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.23'
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: source/ml_financial_prediction
        run: uv sync --locked --group dev --extra models --extra data
      - name: Run explicit course policy with receipt verification
        working-directory: source/ml_financial_prediction
        env:
          FINPRED_ALLOW_PUBLIC_DATA: 'true'
          GH_TOKEN: ${{ secrets.FINPRED_DATA_TOKEN || github.token }}
          FINPRED_FRED_TRANSPORT: curl_ipv4
          FINPRED_DATA_REPOSITORY: ${{ vars.FINPRED_DATA_REPOSITORY || github.repository }}
          FINPRED_DATA_ROOT: ${{ github.workspace }}/live-data
          FINPRED_COURSE_MODE: ${{ inputs.mode || 'rehearsal' }}
          FINPRED_EVENT_NAME: ${{ github.event_name }}
          FINPRED_SCHEDULE: ${{ github.event.schedule }}
          FINPRED_TARGET_DATE: ${{ inputs.target_date }}
          # User explicitly authorized automatic course prediction uploads.
          # All source/model/window/quota/durable-ledger/receipt gates still apply.
          FINPRED_SUBMISSION_RELEASED: 'true'
          COURSE_EMAIL: ${{ secrets.COURSE_EMAIL }}
          COURSE_PASSWORD: ${{ secrets.COURSE_PASSWORD }}
        run: uv run --locked --no-sync bash deployment/hosted/run-course.sh
