[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "finpred"
version = "0.2.0"
description = "Point-in-time market features for the course financial prediction system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3",
]

[project.optional-dependencies]
models = [
    "scikit-learn>=1.7,<2",
]
data = [
    "exchange-calendars>=4.11,<5",
]
neural = [
    "torch>=2.5,<2.9",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finpred"]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
