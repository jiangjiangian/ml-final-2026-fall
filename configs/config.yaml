# 所有可以調的設定都放這裡；程式裡不要寫死這些值。
# 帳號密碼不放這裡，放 .env（本機）或執行環境的 secret。

competition:
  timezone: Asia/Taipei
  deadline: "09:00"              # 預測日 t 當天的截止時間
  upload_cutoff: "08:50"         # submit.py 自己的截止，留 10 分鐘給上傳和核對
  stocks: Top50@Y                # 老師 info.json 裡要預測的 50 檔；實際順序以當天範本為準
  label: y                       # y = 1 代表 etl:adj_close > etl:adj_open

course_site:
  base_url: https://final.html2026.csie.org
  login: /api/auth/login                         # POST，JSON 帶 email、password
  training_zip: /downloads/fin_pred_data.zip     # 老師 Training 資料；ZIP 裡的路徑開頭有一層 data/
  template: /api/sample-submission?phase=2&tradingDate={date}   # 當天的範本，定出 50 檔順序；用 utf-8-sig 讀
  template_phase1: /api/sample-submission?phase=1             # Phase 1 的範本：表頭 id 加 84 個交易日（2026-06-01～09-30）
  state: /api/state              # 交易日和截止（phase2Days、openAt、deadline）、上傳次數（uploadQuota）、目前的提交（mySubmissions）
  submissions: /api/submissions  # POST 上傳，JSON 格式見 src/submit.py；舊程式的研究整理出來的，還沒實際送過
  submission_file: /api/submissions/{id}?record=current   # 下載目前有效的那份；id 來自 state 的 mySubmissions
  timeout_seconds: [10, 90]      # 課程網站和 Live 的連線、讀取逾時
  total_timeout_seconds: 120     # 每個請求從送出到下載完的總時間上限（含轉址）
  login_retries: 2               # 登入遇到逾時、連不上、429、5xx 時再試幾次（使用者 2026-11-06）；上傳一律不重試
  max_zip_mb: 100                # 下載的 ZIP 上限
  max_unzipped_mb: 512           # ZIP 解開後的總大小上限
  live:                          # 老師 Live 資料；金鑰放 .env 的 COURSE_LIVE_KEY
    base_url: https://140.112.31.182:8444      # 助教原本的網址，自簽憑證（使用者 2026-11-06：這個優先）
    ca_file: configs/live_ca.pem   # 只信任它這一張憑證（公開的，不是密碼），有效到 2027-10-07
    fallback_url: https://fin-pred-daily.jiangxuehaokeai.chatgpt.site   # 原本的連不上或出錯才用；助教說它承受不了太多流量
    login: /login                # POST，表單帶 key
    zip: /data.zip

crawler:
  start_time: "07:00"            # 每日模式（--date t）在 t 當天這個時間（台北）以前不跑
  deadline: "08:30"              # 每日模式過了這個時間就不再等待或重試：yfinance 沒抓到的序列沿用舊檔；Live 還沒好就停下報錯
  live_wait_seconds: 180         # Live 還沒有 t 那列，或逾時、連不上、429、5xx、ZIP 不完整時，等多久再抓
  live_attempts: 3               # Live 最多抓幾次
  min_stocks_filled: 90          # 100 檔裡有幾檔有 t 那列、i 那天填好就算數；個別停牌的那幾檔自己的特徵空白
  closed_days: ["2026-10-23"]    # Live 有建列但台股休市的日子（10/23 颱風假）。之後這天出現填好的資料就報錯停下。爬蟲和 features.py 共用

tx_futures:                      # 台指期（使用者 2026-11-06 加）。日盤、夜盤的價格 yfinance 和老師的資料都沒有
  source: taifex                 # 開關：taifex（期交所網站下載）或 yfinance（使用者 2026-11-06：預設用期交所）
  yfinance: {day: null, night: null}   # source 是 yfinance 時用的 Yahoo 代號，日盤存成 yfinance/tx_day.csv。
                                 # Yahoo 現在沒有有歷史的台指期（2026-11-06 查），沒填時切過去會報錯；
                                 # 夜盤代號還不支援（要先查證 Yahoo 怎麼標夜盤的日期），填了也會報錯
  taifex:
    url: https://www.taifex.com.tw/cht/3/futDataDown   # 期貨每日交易行情下載：POST，一次最多一個月，回 CP950 的 CSV
    commodity: TX                # 臺股期貨；存成 data/raw/taifex/tx.csv
    min_interval_seconds: 2      # 每個請求至少間隔幾秒
    timeout_seconds: [10, 60]
    max_mb: 10
    retries: 2                   # 逾時、連不上、429、5xx 再試幾次（過了爬蟲截止不重試）
    retry_wait_seconds: [5, 10]
    overlap_days: 7              # 從舊檔最後一天往前幾天開始重抓
    night_ready: "05:15"         # t 當天這個時間以後才收 t 的夜盤列（夜盤 05:00 收盤）

exchange:                        # 證交所、櫃買中心的全市場日資料（使用者 2026-11-08 同意加的來源）
  enabled: false                 # 每天的爬蟲要不要抓（期交所之後補 i 和最近缺的日子）；false 時完全不碰這兩個主機。回補不看這個開關
  gapfill_days: 10               # 每天的爬蟲：老師最近幾個交易日（含 i）裡檔案沒有的日子一起補，新的先
  daily_max_requests: 12         # 每天的爬蟲：每個主機最多送幾個請求（含重試）；平常一天每個主機 2 個
  daily_retries: 0               # 每天的爬蟲：逾時、連不上、回 JSON 的 5xx 再試幾次（回補是 1 次，等 retry_wait_seconds）
  daily_max_failed_dates: 1      # 每天的爬蟲：連續幾天的請求都逾時、連不上或 5xx，就停下那個主機
  daily_budget_seconds: 180      # 每天的爬蟲：這一步開始後過了幾秒就不再送新的請求（也不會超過 crawler.deadline）
  start: "2020-01-02"            # 回補從這天起（--start 可以改）；到哪天預設是本機老師資料最後一個交易日
  min_interval_seconds: 6.5      # 同一個主機：上一個請求結束後至少隔幾秒才送下一個，一次一個；兩個主機各算各的
  timeout_seconds: [10, 60]      # 連線、讀取逾時
  total_timeout_seconds: 120     # 每個請求從送出到下載完的總時間上限
  max_mb: 20                     # 一個回應的大小上限（MI_INDEX 約 0.3 MB）
  retry_wait_seconds: 60         # 逾時、連不上、回 JSON 的 5xx：等這麼久再試一次，還是不行就記失敗、換下一天
  max_failed_dates: 3            # 同一個主機連續幾天的請求都逾時、連不上或 5xx，就當成被擋，這次停下那個主機
  flush_every_dates: 20          # 每做完幾天就寫一次檔；結束和 Ctrl-C 時也寫
  pause: ["07:00", "09:00"]      # 回補：台北這段時間不送請求（每天的排程在跑），睡到結束再繼續。每天的爬蟲不停
  state_file: exchange_backfill.json   # 回補的進度，放在 data.raw_dir 底下
  twse:                          # 證交所（上市）
    base_url: https://www.twse.com.tw
    date_format: "%Y%m%d"        # 路徑裡 {date} 的寫法
    min_stocks: 85               # 交易日的回應至少要有幾檔我們的股票（上市約 90、91 檔），不夠記 no_data、不寫
    valuation: /rwd/zh/afterTrading/BWIBBU_d?date={date}&selectType=ALL&response=json   # 本益比、殖利率、股價淨值比
    quotes: /rwd/zh/afterTrading/MI_INDEX?date={date}&type=ALLBUT0999&response=json     # 每日收盤行情
  tpex:                          # 櫃買中心（上櫃）
    base_url: https://www.tpex.org.tw
    date_format: "%Y/%m/%d"
    min_stocks: 8                # 上櫃約 9、10 檔（6446 在 2024 年轉上市）
    valuation: /www/zh-tw/afterTrading/peQryDate?date={date}&response=json   # 每股股利、股利年度是回填的，不存
    quotes: /www/zh-tw/afterTrading/otc?date={date}&type=EW&response=json    # 上櫃股票每日收盤行情

data:
  start: "2020-01-01"
  raw_dir: data/raw
  processed_dir: data/processed
  submission_dir: data/submission

yfinance:
  min_interval_seconds: 2        # 每個請求（含 cookie、crumb、轉址）至少間隔幾秒，從上一個請求結束算起
  jitter_seconds: 1              # 間隔再加 0～這麼多秒的隨機
  max_redirects: 5               # 轉址最多跟幾次，每一次也要過限流
  timeout_seconds: 30            # 每個日K請求的逾時
  max_retries: 3                 # 一個序列失敗後最多重試幾次
  retry_wait_seconds: [5, 10, 20]        # 一般錯誤，第 1、2、3 次重試前等幾秒
  rate_limit_wait_seconds: [15, 30, 60]  # 被 Yahoo 限流（429）時等幾秒
  breaker_series: 2              # 連續幾個序列因為限流放棄，就停掉剩下的
  recheck_wait_seconds: 60       # 缺「前一個台股交易日」那根K棒的序列，等多久一起重抓一次
  cache_dir: .cache/yfinance     # yfinance 的時區和 cookie 快取，放在 repo 裡但不進 Git
  hourly: {usd_twd_1h: TWD=X}    # 1 小時K棒（features 的 usd_twd_am 用）：名稱: Yahoo 代號，存成 <名稱>.csv，每次和舊檔合併
  hourly_overlap_days: 7         # 1h 從舊檔最後一根往前幾天開始抓
  volume_required: [TSM, NVDA, 0050.TW, 0052.TW, 0055.TW, 006201.TWO]   # 前一個交易日那根的成交量要 > 0（只有個股和 ETF）
  futures: [CL=F, GC=F]          # 台北 07:00 後已開始下一段交易：抓取範圍截在紐約 17:30；最後一根量太小只記錄，不丟
  tickers:                       # 名稱: Yahoo 代號
    sox: ^SOX                    # 費城半導體指數
    tsm_adr: TSM                 # 台積電 ADR
    nvda: NVDA                   # 輝達
    usd_twd: TWD=X               # 美元兌台幣
    dxy: DX-Y.NYB                # 美元指數
    us10y: ^TNX                  # 美國 10 年期公債殖利率
    us13w: ^IRX                  # 美國 13 週國庫券殖利率
    etf_0050: 0050.TW            # 元大台灣 50
    etf_0052: 0052.TW            # 富邦科技
    etf_0055: 0055.TW            # 元大 MSCI 金融
    etf_006201: 006201.TWO       # 元大富櫃 50
    dji: ^DJI                    # 道瓊
    n225: ^N225                  # 日經 225
    hsi: ^HSI                    # 恒生
    sse: 000001.SS               # 上證綜合
    stoxx50e: ^STOXX50E          # 歐洲斯托克 50
    gdaxi: ^GDAXI                # 德國 DAX
    wti: CL=F                    # WTI 原油期貨
    gold: GC=F                   # 黃金期貨
    vix: ^VIX                    # 波動率指數（使用者 2026-11-06：老師 Live 的 ^VIX 不是收盤，模型改用這個）
    kospi: ^KS11                 # 韓國 KOSPI；組員 2026-11-08 要的日韓開盤，features 用它的 open 算 kospi_open_gap

features:
  lags: [1, 2]                   # 報酬往回看幾個交易日（使用者和組員 2026-11-06 決定只用 lag1、lag2）
  # lag k：t 那列 = (close_i − close_(i−k)) / close_(i−k)，i = t 的前一個台股交易日
  stock_column: etl:adj_close    # 老師個股檔算報酬用的欄；這組特徵讓 50 檔每天的值不同
  teacher_global: ["^VIX", "^IXIC", "^GSPC", "^TWII", "^KS11"]   # 老師 global 表要算 lag 的欄
  adj_close_kinds: [TSM, NVDA, 0050.TW, 0052.TW, 0055.TW, 006201.TWO]   # 這些 yfinance 代號用 adj_close，其他用 close
  # 輸出在 data.processed_dir：features/YYYY-MM.csv.gz 一個月一檔、manifest.json（月份清單、模型欄、清理紀錄）。
  # 都進 Git，組員用網址讀。每天只重寫最後兩個月，過去的月份不動（使用者 2026-11-06）
  rewrite_months: 2
  # 模型用的序列（使用者和組員 2026-11-06 定）：個股自己＋組員的 12 個指標（債利率是 us13w、us10y 兩個序列）。
  # 特徵表裡有全部序列；train.py、predict.py 只讀這些序列的 lag 欄（manifest.json 的 model_columns）。
  # 使用者 2026-11-06 加台指期日盤 tx_day、夜盤 tx_night，共 16 個序列、32 欄。
  # 使用者 2026-11-06：teacher_vix 換成 yfinance 的 vix（老師 Live 的 ^VIX 不是收盤），teacher_vix 還留在表裡。
  model_series: [stock, sox, tsm_adr, nvda, teacher_ixic, teacher_gspc, vix, etf_0050, usd_twd_am,
                 gold, dji, wti, us13w, us10y, tx_day, tx_night]
  usd_twd_am:                    # 和美股收盤同步的匯率：台北 d 日 06:00 前最後一根 1h 的 close
    daily: usd_twd               # 小時資料開始之前，用這個序列 d 那根日K的 close 補
    hourly: usd_twd_1h           # yfinance.hourly 的名稱，檔案是 data/raw/yfinance/usd_twd_1h.csv（欄位見 crawler.HOURLY_COLUMNS）
    hourly_from: "2024-01-22"    # Yahoo 1h 最早到這天；分界取這天和 1h 檔第一天較晚的那個
    at: "06:00"                  # 台北時間；取結束時間 ≤ 這個時間的最後一根
    lookback_days: 4             # 最多往回找幾天（冬令週一 05:00 那根不存在，要取到週五收盤）
                                 # 也要晚於前一個交易日的 06:00，不然是沒更新的舊K棒，空白（使用者 2026-11-08）
  # 以下是使用者 2026-11-08 決定加的欄，只進長表，不進 model_columns。
  optional_inputs: [kospi]       # yfinance 檔不見時只記 log 和 manifest 的 notes，不算缺檔（照樣可以 --rebuild）
  teacher_fresh: ["^GSPC", "^IXIC"]   # 老師 global 用 t 自己那列（t 開盤前最後一次美股收盤）的版本，
                                 # 欄名 teacher_gspc_fresh_ret_lag1 等。只能放這兩欄：^TWII、^KS11、TX_OI 是 t 當天收盤
  open_gap:                      # 當天開盤跳空：d 那列 = d 那根的 open ÷ 前一根的 close − 1。全表唯一用到當天資料的欄，
    series: [kospi, n225]        # 不能進 model_columns（model_columns() 會擋）。t 那列一律空白，隔天重算時補上
    late_open:                   # 韓國 10:00（台北 09:00）才開盤的日子留空白：每年第一個交易日（從序列找）和大學入學考試日
      kospi:
        first_day_of_year: true
        days: ["2020-12-03", "2021-11-18", "2022-11-17", "2023-11-16", "2024-11-14", "2025-11-13", "2026-11-19"]
  tick_table:                    # 台股升降單位：[價格未滿多少, 一檔多少]，最後一列是以上全部。quote_spread_ticks 用
    - [10, 0.01]
    - [50, 0.05]
    - [100, 0.1]
    - [500, 0.5]
    - [1000, 1]
    - [null, 5]
  cleaning:                      # yfinance 清理 R0～R5 的參數，和舊爬蟲一樣（memory/projects/features.md）
    yields: [^TNX, ^IRX]         # R2 債市假日只看這兩個；它們和 yfinance.futures 的 close 可以 ≤ 0
    bad_tick_tolerance: 0.005    # R1：close 超出 [low, high] 多少比例算壞報價
    partial_bar_window: 21       # R3：取前幾個保留下來的列算成交量中位數
    partial_bar_volume_ratio: 0.01   # R3：平盤而且成交量小於中位數的這個比例，算不完整K棒
    max_split_factor: 50         # R4：分割倍數上限
    split_tolerance: 0.03        # R4：前後收盤比和整數 n 的相對差要小於這個
    dividend_step_min: 1.0e-5    # R5：調整比例的變化大於這個才算除息
    dividend_max_fraction: 0.95  # R5：乘回後的除息比例上限

model:
  type: lightgbm
  valid_days: 60                 # 最後幾個交易日拿來驗證
  params:
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 15
    random_state: 42
  path: models/model.txt
  feature_list: models/feature_columns.json

online_lr:                       # 組員的方法（notebooks/feature_switch.ipynb 第 6 節），run_daily_test.py 用（使用者 2026-11-06）
  train_months: 14               # 每週重訓：用 fit_end 之前這麼多個月有答案的列（100 檔都用）
  online_weeks: 2                # fit_end = 預測那週的週一往前這麼多週；之後每天用前一天的答案做 GD
  C: 0.05                        # LogisticRegression 的正則化強度的倒數（越小越強）
  max_iter: 2000
  learning_rate: 0.05            # 每天 GD 的步長
  steps: 5                       # 每天走幾步
  clip_z: 5                      # 標準化後截在 ±5
  threshold: 0.5                 # 機率 > 這個猜 1

submit:
  enabled: true                  # 使用者 2026-11-06 確認舊系統的排程停了才打開；false 時只印出要送的內容
  phase: 2                       # run_daily_test.py 交哪一個：1 = Phase 1（84 天回測），2 = 每天的 t（使用者 2026-11-07：Phase 1 自動化測試成功後改 2）
