name: External source connection diagnostics

on:
  push:
    branches: [system-completion]
    paths:
      - .github/workflows/source-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.23'
          python-version: '3.12'
      - name: Install locked source dependencies
        working-directory: ml_financial_prediction
        run: uv sync --locked
      - name: Compare requests and verified TLS curl IPv4
        working-directory: ml_financial_prediction
        run: >-
          uv run --locked --no-sync python scripts/diagnose_external_sources.py
          --source fred_us10y --source fred_usd_twd --include-curl-ipv4
