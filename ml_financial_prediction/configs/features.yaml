# 規格對照；M0已由src/finpred/features/market.py實作固定schema，此CLI不讀此YAML。
# 教師資料availability仍未核實；M1-M4尚未實作。
schema_version: proposed-v1
timezone: Asia/Taipei
feature_cutoff_local: '08:10:00'
availability_status: unverified
alignment:
  method: backward_asof_by_available_at
  target_calendar: competition_session_template
  preserve_all_target_dates: true
  original_global_already_shifted: null
  compute_returns_before_alignment: true
  complete_native_sessions_required_for_1s_return: true
  no_bfill: true
  on_missing: nan_plus_missing_age_and_fresh_flags
feature_groups:
  M0:
    price_indices:
      - {id: ixic, teacher_column: '^IXIC', transform: native_close_return_1session}
      - {id: gspc, teacher_column: '^GSPC', transform: native_close_return_1session}
      - {id: twii, teacher_column: '^TWII', transform: native_close_return_1session}
      - {id: ks11, teacher_column: '^KS11', transform: native_close_return_1session}
    volatility:
      - {id: vix, teacher_column: '^VIX', transforms: [level, difference_points]}
    positioning:
      - {id: tx_foreign_net_oi, teacher_column: TX_OI, transforms: [level, difference_contracts]}
  M1: {status: proposed, series: [sox]}
  M2: {status: proposed, series: [tsm_adr, nvda]}
  M3: {status: proposed, series: [usd_twd, us_10y_yield]}
  M4: {status: proposed, series: [tw_electronics, tw_semiconductor, tw_financials]}
