name: Live data synchronization

# A push registers/rehearses the workflow while main remains empty. Cron starts
# only after this workflow exists on the repository's chosen default branch.
on:
  push:
    branches: [system-completion]
    paths:
      - .github/workflows/live-data.yml
      - ml_financial_prediction/src/finpred/data/sharing.py
      - ml_financial_prediction/scripts/run_hosted_pipeline.py
      - ml_financial_prediction/deployment/hosted/**
  workflow_dispatch:
    inputs:
      mode:
        description: Collection publishes successful sources; rehearsal only reads and verifies
        required: true
        type: choice
        default: rehearsal
        options: [rehearsal, collect]
  schedule:
    - cron: '17 20-23 * * *'

permissions:
  contents: write

# Shared with financial-daily.yml, across every branch and every stage.
concurrency:
  group: finpred-private-runtime
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out versioned source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: source
          persist-credentials: false
      - name: Check out private live-data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: live-data
          path: live-data
          fetch-depth: 1
          persist-credentials: true
      - name: Set up locked Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.23'
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: source/ml_financial_prediction
        run: uv sync --locked --group dev --extra models --extra data
      - name: Verify and synchronize private snapshots
        working-directory: source/ml_financial_prediction
        env:
          GH_TOKEN: ${{ github.token }}
          FINPRED_DATA_ROOT: ${{ github.workspace }}/live-data
          # Push runs exercise public adapters too. Missing course secrets produce
          # an explicit partial collection, preserving the seeded course version.
          FINPRED_MODE: ${{ inputs.mode || 'collect' }}
          COURSE_EMAIL: ${{ secrets.COURSE_EMAIL }}
          COURSE_PASSWORD: ${{ secrets.COURSE_PASSWORD }}
          COURSE_LIVE_KEY: ${{ secrets.COURSE_LIVE_KEY }}
        shell: bash
        run: uv run --locked --no-sync bash deployment/hosted/run.sh
      # No public artifact, cache-as-database, raw log dump or force push.
