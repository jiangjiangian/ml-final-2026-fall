name: Hosted financial pipeline

on:
  push:
    branches: [system-completion]
    paths:
      - .github/workflows/financial-daily.yml
  workflow_dispatch:
    inputs:
      stage:
        description: Auto selects only the currently valid Taipei stage window
        required: true
        type: choice
        default: auto
        options: [auto, train, predict, submit, verify]
      target_date:
        description: Optional official YYYY-MM-DD; does not bypass real clock gates
        required: false
        type: string
  schedule:
    - cron: '20 23 * * *'
    - cron: '10 0 * * *'
    - cron: '20 0 * * *'
    - cron: '35 0 * * *'

permissions:
  contents: write

concurrency:
  group: finpred-private-runtime
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out versioned source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: source
          persist-credentials: false
      - name: Verify data repository visibility before checkout
        env:
          # User explicitly requested all data and code public; set false to restore private-only operation.
          FINPRED_ALLOW_PUBLIC_DATA: 'true'
          FINPRED_DATA_REPOSITORY: ${{ vars.FINPRED_DATA_REPOSITORY || github.repository }}
          FINPRED_DATA_TOKEN: ${{ secrets.FINPRED_DATA_TOKEN }}
          GH_TOKEN: ${{ secrets.FINPRED_DATA_TOKEN || github.token }}
        shell: bash
        run: bash source/ml_financial_prediction/deployment/hosted/preflight.sh
      - name: Check out durable data and state
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ vars.FINPRED_DATA_REPOSITORY || github.repository }}
          token: ${{ secrets.FINPRED_DATA_TOKEN || github.token }}
          ref: live-data
          path: live-data
          fetch-depth: 1
          persist-credentials: true
      - name: Set up locked Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.23'
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: source/ml_financial_prediction
        run: uv sync --locked --group dev --extra models --extra data
      - name: Rehearse restore or run the clock-gated stage
        working-directory: source/ml_financial_prediction
        env:
          FINPRED_ALLOW_PUBLIC_DATA: 'true'
          GH_TOKEN: ${{ secrets.FINPRED_DATA_TOKEN || github.token }}
          FINPRED_DATA_REPOSITORY: ${{ vars.FINPRED_DATA_REPOSITORY || github.repository }}
          FINPRED_DATA_ROOT: ${{ github.workspace }}/live-data
          FINPRED_MODE: ${{ github.event_name == 'push' && 'rehearsal' || 'financial' }}
          FINPRED_EVENT_NAME: ${{ github.event_name }}
          FINPRED_SCHEDULE: ${{ github.event.schedule }}
          FINPRED_STAGE: ${{ inputs.stage || 'auto' }}
          FINPRED_TARGET_DATE: ${{ inputs.target_date }}
          FINPRED_SUBMISSION_RELEASED: ${{ vars.FINPRED_SUBMISSION_RELEASED || 'false' }}
          COURSE_EMAIL: ${{ secrets.COURSE_EMAIL }}
          COURSE_PASSWORD: ${{ secrets.COURSE_PASSWORD }}
          COURSE_LIVE_KEY: ${{ secrets.COURSE_LIVE_KEY }}
        shell: bash
        run: uv run --locked --no-sync bash deployment/hosted/run.sh
