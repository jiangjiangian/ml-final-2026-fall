# 所有可以調的設定都放這裡；程式裡不要寫死這些值。
# 帳號密碼不放這裡，放 .env（本機）或執行環境的 secret。

competition:
  timezone: Asia/Taipei
  deadline: "09:00"              # 過了這個時間就不上傳
  stocks: Top50@Y                # 要預測的 50 檔，來自老師 info.json 的這個欄位
  label: y                       # y = 1 代表 adj_close > adj_open

course_site:
  base_url: https://final.html2026.csie.org
  login: /api/auth/login                         # POST，JSON 帶 email、password
  training_zip: /downloads/fin_pred_data.zip     # 老師 Training 資料
  template: /api/sample-submission?phase=2&tradingDate={date}   # 當天的空白提交檔，定出 50 檔順序
  submissions: /api/submissions                  # POST 上傳
  state: /api/state                              # 查目前有效的提交
  live_zip_url: ""                               # Live 資料另有伺服器和金鑰，還沒決定怎麼取得

data:
  start: "2020-01-01"
  raw_dir: data/raw
  processed_dir: data/processed
  submission_dir: data/submission

yfinance:
  min_interval_seconds: 2        # 每個請求至少間隔幾秒
  max_retries: 3
  tickers:                       # 名稱: Yahoo 代號
    sox: ^SOX                    # 費城半導體指數
    tsm_adr: TSM                 # 台積電 ADR
    nvda: NVDA                   # 輝達
    usd_twd: TWD=X               # 美元兌台幣
    dxy: DX-Y.NYB                # 美元指數
    us10y: ^TNX                  # 美國 10 年期公債殖利率
    us13w: ^IRX                  # 美國 13 週國庫券殖利率
    etf_0050: 0050.TW            # 元大台灣 50
    etf_0052: 0052.TW            # 富邦科技
    etf_0055: 0055.TW            # 元大 MSCI 金融
    etf_006201: 006201.TWO       # 元大富櫃 50
    dji: ^DJI                    # 道瓊
    n225: ^N225                  # 日經 225
    hsi: ^HSI                    # 恒生
    sse: 000001.SS               # 上證綜合
    stoxx50e: ^STOXX50E          # 歐洲斯托克 50
    gdaxi: ^GDAXI                # 德國 DAX
    wti: CL=F                    # WTI 原油期貨
    gold: GC=F                   # 黃金期貨

features:
  lags: [2, 5]                   # 報酬往回看幾個交易日
  # lag k 的定義：t 那列 = (close_i − close_(i−k)) / close_(i−k)，i = t 的前一個台股交易日

model:
  type: lightgbm
  valid_days: 60                 # 最後幾個交易日拿來驗證
  params:
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 15
    random_state: 42
  path: models/model.txt
  feature_list: models/feature_columns.json

submit:
  enabled: false                 # 確認流程沒問題前保持 false：只印出要送的內容，不真的上傳
