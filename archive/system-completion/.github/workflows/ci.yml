name: Python checks

on:
  push:
    branches: [dev, system-completion]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: ml_financial_prediction
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: ml_financial_prediction/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --group dev --extra models --extra data
      - name: Lint Python
        run: uv run --locked --no-sync ruff check src scripts tests
      - name: Run synthetic-data tests
        run: uv run --locked --no-sync python -m unittest discover -s tests -v
